# PostgreSQL solo para desarrollo local. Producción: servicio gestionado (RDS, etc.).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: markdecord
      POSTGRES_PASSWORD: markdecord
      POSTGRES_DB: markdecord
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
